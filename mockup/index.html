<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>タスク管理ボード（モックアップ）</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <a href="#/boards" class="app-title">📋 タスク管理ボード</a>
  <nav id="breadcrumb" class="breadcrumb"></nav>
</header>

<main id="view-board-list" class="view">
  <div class="view-inner">
    <h1 class="view-heading">ボード一覧</h1>
    <div id="board-grid" class="board-grid"></div>
  </div>
</main>

<main id="view-board-detail" class="view hidden">
  <div id="lists-row" class="lists-row"></div>
</main>

<dialog id="card-modal" class="card-modal">
  <form id="card-modal-form" class="card-modal-form">
    <div class="card-modal-header">
      <h2>カード詳細</h2>
      <button type="button" id="card-modal-close" class="icon-btn" aria-label="閉じる">✕</button>
    </div>

    <label class="field-label" for="card-modal-title">タイトル</label>
    <input type="text" id="card-modal-title" name="title" autocomplete="off" />
    <p id="card-modal-title-error" class="field-error hidden">タイトルを入力してください</p>

    <label class="field-label" for="card-modal-description">説明文</label>
    <textarea id="card-modal-description" name="description" rows="6" placeholder="詳細を入力（任意）"></textarea>

    <div class="card-modal-actions">
      <button type="button" id="card-modal-cancel" class="btn btn-ghost">閉じる（保存しない）</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
